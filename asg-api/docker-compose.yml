services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - asg_storage:/tmp/asg_storage
    env_file:
      - .env

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  asg_storage:
  ollama_data:
