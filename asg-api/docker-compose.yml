services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - asg_storage:/tmp/asg_storage
    environment:
      - BACKEND=ollama
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llava:7b
      - STORAGE_TYPE=local
      - LOCAL_STORAGE_PATH=/tmp/asg_storage
      - API_BASE_URL=http://localhost:8000
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  asg_storage:
  ollama_data:
